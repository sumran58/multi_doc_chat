[project]
name = "llmops-series"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sumran Harchirkar", email = "sumranharchirkar58@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "groq>=0.37.1",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.14.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "structlog>=26.1.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
llmops-series = "llmops_series:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
